name: Privatka APK Build
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Название приложения'
        required: true
      application_id:
        description: 'applicationId пакета'
        required: false
        default: ''
      api_id:
        description: 'Telegram API ID'
        required: false
        default: ''
      api_hash:
        description: 'Telegram API Hash'
        required: false
        default: ''
      icon_url:
        description: 'URL иконки (png)'
        required: false
        default: ''
      server_ip:
        description: 'IP сервера gramsrv'
        required: false
        default: ''
      server_port:
        description: 'Порт MTProto gramsrv'
        required: false
        default: '2398'
      rsa_key_url:
        description: 'URL публичного RSA-ключа сервера'
        required: false
        default: ''
      rsa_pub:
        description: 'PEM публичного RSA-ключа (получен с сервера после деплоя)'
        required: false
        default: ''
      build_variant:
        description: 'Вариант: afat/huawei/standalone'
        required: false
        default: 'afat'
      build_type:
        description: 'debug или release'
        required: false
        default: 'debug'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      APPLICATION_ID: ${{ github.event.inputs.application_id }}
      API_ID: ${{ github.event.inputs.api_id }}
      API_HASH: ${{ github.event.inputs.api_hash }}
      ICON_URL: ${{ github.event.inputs.icon_url }}
      SERVER_IP: ${{ github.event.inputs.server_ip }}
      SERVER_PORT: ${{ github.event.inputs.server_port }}
      RSA_KEY_URL: ${{ github.event.inputs.rsa_key_url }}
      RSA_PUB: ${{ github.event.inputs.rsa_pub }}
      BUILD_VARIANT: ${{ github.event.inputs.build_variant }}
      BUILD_TYPE: ${{ github.event.inputs.build_type }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required NDK
        run: |
          NDK_VERSION=$(grep -oP 'ndkVersion\s+"\K[^"]+' build.gradle* 2>/dev/null | head -1 || true)
          [ -n "$NDK_VERSION" ] || NDK_VERSION="27.0.12077973"
          echo "NDK version: $NDK_VERSION"
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VERSION" || true
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Apply privatka branding patches
        run: python3 privatka_patch.py

      - name: Validate patched config
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys
          app_id = os.environ.get("APPLICATION_ID", "").strip() or "org.telegram.messenger"
          ok = True
          # gradle.properties: APP_PACKAGE должен быть нашим (источник applicationId app-модулей)
          gp = open("gradle.properties", encoding="utf-8").read()
          m = re.search(r"(?m)^APP_PACKAGE=(.+)$", gp)
          if not m or m.group(1).strip() != app_id:
              print(f"FAIL: gradle.properties APP_PACKAGE={m.group(1).strip() if m else None!r}, ожидался {app_id!r}"); ok = False
          else:
              print(f"OK: gradle.properties APP_PACKAGE={app_id!r}")
          # namespace библиотеки TMessagesProj должен остаться org.telegram.messenger
          tmb = open("TMessagesProj/build.gradle", encoding="utf-8").read()
          if "namespace 'org.telegram.messenger'" not in tmb:
              print("FAIL: TMessagesProj/build.gradle: namespace изменён — сломается R/BuildConfig"); ok = False
          else:
              print("OK: TMessagesProj namespace сохранён")
          # google-services.json должен содержать client с нашим applicationId
          for p in __import__("glob").glob("TMessagesProj*/google-services.json"):
              data = json.load(open(p, encoding="utf-8"))
              pkgs = {c.get("client_info", {}).get("android_client_info", {}).get("package_name")
                      for c in data.get("client", [])}
              if app_id not in pkgs:
                  print(f"FAIL: {p}: нет client для {app_id!r} (есть {sorted(pkgs)})"); ok = False
              else:
                  print(f"OK: {p}: client {app_id!r} на месте")
          # agconnect-services.json (Huawei): package_name должен совпадать с applicationId
          for p in __import__("glob").glob("TMessagesProj*/agconnect-services.json"):
              data = json.load(open(p, encoding="utf-8"))
              pname = (data.get("client") or {}).get("package_name")
              if pname != app_id:
                  print(f"FAIL: {p}: client.package_name={pname!r}, ожидался {app_id!r}"); ok = False
              else:
                  print(f"OK: {p}: package_name={app_id!r}")
          # Handshake.cpp должен содержать RSA PUBLIC KEY и fingerprint
          hs = None
          for cand in ("TMessagesProj/jni/tgnet/Handshake.cpp",):
              if os.path.exists(cand): hs = cand
          if hs:
              t = open(hs, encoding="utf-8", errors="replace").read()
              if "BEGIN RSA PUBLIC KEY" not in t:
                  print(f"FAIL: {hs}: нет RSA-ключа"); ok = False
              else:
                  print(f"OK: {hs}: RSA-ключ вшит")
          # endpoint: в tgnet не должно остаться адресов Telegram
          cm = "TMessagesProj/jni/tgnet/Connections.cpp"
          if os.path.exists(cm):
              t = open(cm, encoding="utf-8", errors="replace").read()
              leftover = [p for p in ("149.154.", "91.108.", "95.161.") if p in t]
              if leftover:
                  print(f"FAIL: {cm}: остались адреса Telegram: {leftover}"); ok = False
              else:
                  print(f"OK: {cm}: адреса Telegram заменены")
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Build APK
        run: |
          chmod +x gradlew
          cap(){ printf '%s' "$1" | awk '{print toupper(substr($0,1,1)) substr($0,2)}'; }
          VARIANT=${BUILD_VARIANT:-afat}
          BTYPE=${BUILD_TYPE:-debug}
          # собираем ТОЛЬКО нужный app-модуль: корневой assembleX тащит все
          # варианты (Huawei/AGConnect, Standalone) — лишние точки отказа
          case "$VARIANT" in
            huawei)     MODULE=TMessagesProj_AppHuawei ;;
            standalone) MODULE=TMessagesProj_AppStandalone ;;
            *)          MODULE=TMessagesProj_App ;;
          esac
          TASK=":${MODULE}:assemble$(cap "$VARIANT")$(cap "$BTYPE")"
          echo "Gradle task: $TASK"
          ./gradlew "$TASK" --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: privatka-apk
          path: TMessagesProj*/build/outputs/apk/**/*.apk
          if-no-files-found: error
